<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Vibe Engineering Quiet Signal brand board</title>
  <desc id="desc">Canonical Vibe Engineering palette, type, motion, and verification language for the public Client Zero experience.</desc>
  <rect width="1600" height="1000" fill="#171512"/>
  <g fill="none" stroke="#EFE8DC" stroke-opacity=".10">
    <path d="M80 0V1000M320 0V1000M560 0V1000M800 0V1000M1040 0V1000M1280 0V1000M1520 0V1000"/>
    <path d="M0 100H1600M0 340H1600M0 610H1600M0 900H1600"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="82" fill="#B65F3D" font-size="20" font-weight="700" letter-spacing="5">V.I.B.E. / QUIET SIGNAL / 2026</text>
    <text x="80" y="220" fill="#EFE8DC" font-size="112" font-weight="900" letter-spacing="-7">VERIFY IT</text>
    <text x="80" y="312" fill="#EFE8DC" font-size="112" font-weight="900" letter-spacing="-7">BEFORE EVERYTHING.</text>
    <g transform="translate(1240 120)">
      <circle cx="120" cy="120" r="108" stroke="#B65F3D" stroke-opacity=".42" stroke-width="2" fill="none"/>
      <path d="M36 44h42l42 112 42-112h42l-68 144h-32L36 44Z" fill="#B65F3D"/>
      <text x="120" y="260" text-anchor="middle" fill="#D7C9B7" font-size="15" letter-spacing="2">THE PROOF MARK</text>
    </g>
    <text x="80" y="390" fill="#D7C9B7" font-size="16" font-weight="700" letter-spacing="3">COLOR / WARM MATERIAL + ONE SIGNAL</text>
    <g transform="translate(80 425)">
      <rect width="240" height="128" fill="#171512" stroke="#EFE8DC" stroke-opacity=".20"/>
      <text x="18" y="82" fill="#EFE8DC" font-size="19" font-weight="700">INK</text><text x="18" y="108" fill="#D7C9B7" font-size="14">#171512</text>
      <rect x="260" width="240" height="128" fill="#EFE8DC"/>
      <text x="278" y="82" fill="#171512" font-size="19" font-weight="700">PAPER</text><text x="278" y="108" fill="#6D675E" font-size="14">#EFE8DC</text>
      <rect x="520" width="240" height="128" fill="#D7C9B7"/>
      <text x="538" y="82" fill="#171512" font-size="19" font-weight="700">BONE</text><text x="538" y="108" fill="#6D675E" font-size="14">#D7C9B7</text>
      <rect x="780" width="240" height="128" fill="#B65F3D"/>
      <text x="798" y="82" fill="#171512" font-size="19" font-weight="700">OXIDE</text><text x="798" y="108" fill="#171512" font-size="14">#B65F3D / LARGE SIGNAL</text>
      <rect x="1040" width="240" height="128" fill="#7C3C27"/>
      <text x="1058" y="82" fill="#F7F1E7" font-size="19" font-weight="700">OXIDE DARK</text><text x="1058" y="108" fill="#F7F1E7" font-size="14">#7C3C27 / UI</text>
      <rect x="1300" width="220" height="128" fill="#24211D"/>
      <text x="1318" y="82" fill="#EFE8DC" font-size="19" font-weight="700">INK SOFT</text><text x="1318" y="108" fill="#D7C9B7" font-size="14">#24211D</text>
    </g>
    <text x="80" y="664" fill="#D7C9B7" font-size="16" font-weight="700" letter-spacing="3">TYPE / TWO FAMILIES MAX</text>
    <text x="80" y="746" fill="#EFE8DC" font-size="66" font-weight="800" letter-spacing="-3">HELVETICA / SYSTEM SANS</text>
    <text x="80" y="786" fill="#D7C9B7" font-size="18">Direct / cultural / architectural / readable</text>
    <text x="875" y="746" fill="#EFE8DC" font-size="54" font-family="Georgia, Times New Roman, serif" font-style="italic">Georgia / editorial</text>
    <text x="875" y="786" fill="#D7C9B7" font-size="18">Human counterpoint / sparse emphasis only</text>
    <line x1="80" y1="850" x2="1520" y2="850" stroke="#EFE8DC" stroke-opacity=".18"/>
    <text x="80" y="894" fill="#B65F3D" font-size="17" font-weight="700" letter-spacing="3">MOTION / MUSIC-VIDEO MODE</text>
    <text x="80" y="936" fill="#EFE8DC" font-size="24" font-weight="700">SCROLL = STORY / MUSIC = IMPACT / HUMAN = FINAL CALL</text>
    <text x="80" y="974" fill="#D7C9B7" font-size="15">Quiet Signal. No neon identity. No agent soup. Build the vibe, set the bar, prove the result. The Pauli Effect · 2026.</text>
