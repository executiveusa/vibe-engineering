    <line x1="80" y1="850" x2="1520" y2="850" stroke="#EFECE2" stroke-opacity=".18"/>
    <text x="80" y="894" fill="#C9FF38" font-size="17" font-weight="700" letter-spacing="3">MOTION</text>
    <text x="80" y="936" fill="#EFECE2" font-size="24" font-weight="700">OPTIONS → REJECT → PAUSE → VERIFY → MOVE FORWARD</text>
    <text x="80" y="974" fill="#B7B5AD" font-size="15">Urban without cosplay. Human taste over model defaults. Proof before claims. Built by The Pauli Effect · 2026 · Part of the Pauli Suite.</text>
