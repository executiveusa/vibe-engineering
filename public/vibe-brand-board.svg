<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Vibe Engineering brand board v1</title>
  <desc id="desc">Canonical visual proof board for Vibe Engineering by The Pauli Effect, 2026.</desc>
  <rect width="1600" height="1000" fill="#0B0D0B"/>
  <g fill="none" stroke="#EFECE2" stroke-opacity=".10">
    <path d="M80 0V1000M320 0V1000M560 0V1000M800 0V1000M1040 0V1000M1280 0V1000M1520 0V1000"/>
    <path d="M0 100H1600M0 340H1600M0 610H1600M0 900H1600"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="82" fill="#C9FF38" font-size="20" font-weight="700" letter-spacing="5">V.I.B.E. / BRAND SYSTEM / 2026</text>
    <text x="80" y="220" fill="#EFECE2" font-size="112" font-weight="900" letter-spacing="-7">VERIFY IT</text>
    <text x="80" y="312" fill="#EFECE2" font-size="112" font-weight="900" letter-spacing="-7">BEFORE EVERYTHING.</text>
    <g transform="translate(1240 120)">
