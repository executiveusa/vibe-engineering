id: zero-to-product
version: 1.2.0
title: Zero to Finished Product
audience: non-technical founders and operators
promise: Start with a fuzzy idea and finish with a proven, reviewable, releasable product.
entry: AGENTS.md -> ICMR.yaml -> CONTEXT.md
execution_modes:
  guided:
    default: true
    interface: Vibe Journey
    behavior: Human-guided, stage-by-stage progression with explicit verification at each level.
  loop-engineering:
    default: false
    skill: loop-engineering
    plugin_command: /vibe-loop
    behavior: Long-running end-to-end execution that may traverse the full workflow autonomously between human gates.
    lifecycle: INTENT -> BAR -> LOCK -> EVIDENCE -> GRAPH -> SPEC -> SLICE -> BUILD -> VERIFY -> GAUNTLET -> RELEASE -> LEARN
    may_bypass_gates: false
    may_self_approve: false
advancement:
  rule: A stage advances only when all declared gates pass and durable proof or a receipt is written.
  state_file: .vibe/CURRENT.json
  receipts_dir: .vibe/receipts
  fail_state: HOLD
  allow_manual_skip: false
  allow_agent_self_approval: false
  require_receipt: true
  adapter_may_bypass_gates: false
review_engine:
  repository: https://github.com/executiveusa/open-code-review
  role: primary-code-review-engine
  skill: review
  rerun_after_fixes: true
phases:
  - id: 00-start
    primary: [setup-vibe, ask-vibe]
    support: [explain, teach, loop-engineering]
    gates: [project-walkable, owner-intent-named]
  - id: 01-discover
    primary: [grill-idea, grill]
    support: [interview, ask-human, research, language]
    gates: [user-and-problem-clear, critical-assumptions-recorded]
  - id: 02-define
    primary: [map, spec]
    support: [prototype]
    gates: [outcome-clear, standard-clear, acceptance-testable, non-goals-recorded]
  - id: 03-plan
    primary: [tickets]
    support: [architecture-check, module-design, triage]
    gates: [slices-ordered, dependencies-visible, proof-defined]
  - id: 04-build
    primary: [build]
    support: [test-first, debug, deep-work]
    gates: [slice-complete, tests-pass, build-pass]
  - id: 05-review
    primary: [review, project-review]
    support: [stop-slop, taste, human-voice, agent-docs]
    gates: [open-code-review-pass, material-findings-resolved, stop-slop-pass, taste-pass]
  - id: 06-prove
    primary: [proof]
    support: []
    gates: [claims-mapped-to-evidence, exact-candidate-proven]
  - id: 07-integrate
    primary: [merge]
    support: [handoff]
    gates: [integration-coherent, affected-tests-pass]
  - id: 08-release
    primary: [ship]
    support: [human-step]
    gates: [owner-ship-authority, rollback-ready, production-smoke-pass]
  - id: 09-learn
    primary: [handoff]
    support: [teach, ask-vibe]
    gates: [handoff-written, retrospective-written]
completion:
  require_exact_candidate: true
  require_review: true
  require_proof: true
  require_human_release_authority: true
  require_rollback: true
  require_all_stage_receipts: true
