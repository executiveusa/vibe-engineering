name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Test release logic
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Audit dependencies
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            set +e
            output=$(npm audit --audit-level=high \
              --fetch-retries=1 \
              --fetch-retry-mintimeout=1000 \
              --fetch-retry-maxtimeout=5000 \
              --fetch-timeout=30000 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if printf '%s\n' "$output" | grep -Eqi '503 Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
              if [ "$attempt" -lt 3 ]; then
                echo "Transient npm audit service failure; retrying ($attempt/3)."
                sleep $((attempt * 3))
                continue
              fi
            fi

            exit "$status"
          done

          exit 1
