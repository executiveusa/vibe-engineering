name: Vibe Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  models: read

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Existing reusable workflow no longer exists upstream; use its maintained
      # composite action pinned to an exact reviewed upstream commit.
      - name: Independent OpenCodeReview via GitHub Models
        uses: executiveusa/open-code-review@6386895e7cfac419bd7a9cf4795e8b824a6e3ced
        with:
          llm_url: https://models.github.ai/inference/chat/completions
          llm_auth_token: ${{ github.token }}
          llm_model: openai/gpt-4o
          llm_use_anthropic: 'false'
          llm_protocol: openai
          llm_extra_body: '{}'
          github_token: ${{ github.token }}
          review_concurrency: '3'
          route_severity_below: low
          route_categories: style,documentation
          upload_artifacts: 'true'
          sticky_summary: 'true'
