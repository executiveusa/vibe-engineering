name: Vibe Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verify review credentials are configured
        shell: bash
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
        run: |
          for name in OCR_LLM_URL OCR_LLM_AUTH_TOKEN OCR_LLM_MODEL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required OpenCodeReview configuration: $name"
              exit 1
            fi
          done
      # Use the actual upstream composite action, pinned to a reviewed commit.
      # Never execute PR-head code with reviewer credentials.
      - name: Run independent OpenCodeReview
        uses: executiveusa/open-code-review@152cc6d585043d40c3674d9637a7a06bbd950610
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ secrets.OCR_LLM_MODEL }}
          llm_use_anthropic: 'false'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          review_concurrency: '3'
          route_severity_below: low
          route_categories: style,documentation
          llm_extra_body: '{"enable_thinking":false}'
          upload_artifacts: 'true'
