name: Vibe Code Review

# The former reusable OpenCodeReview workflow was unavailable upstream.
# GitHub Models was retired in 2026. Until a credentialed OCR provider is
# configured, do not claim review success from either of those routes.
# This gate verifies the repository's existing independent Codex PR reviewer.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require independent exact-revision Codex receipt without open P1/P2
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const head = pr.head.sha;
            const expectedBot = 'chatgpt-codex-connector[bot]';
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: pr.number, per_page: 100
            });
            const current = reviews.filter(r => r.user?.login === expectedBot &&
              r.body?.includes('codex-review-receipt:v1') &&
              r.body?.includes('Reviewed commit:') &&
              r.body.match(/Reviewed commit:\*\* \`([0-9a-f]{8,40})\`/)?.[1] === head.slice(0, 10));
            if (!current.length) {
              core.setFailed('HOLD: no independent Codex review receipt for exact PR head ' + head + '. Request @codex review and rerun this gate.');
              return;
            }
            const comments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner, repo, pull_number: pr.number, per_page: 100
            });
            const material = comments.filter(c => c.user?.login === expectedBot &&
              c.original_commit_id === head &&
              /codex-code-review-finding:v1/.test(c.body || '') &&
              /P[012] Badge/.test(c.body || ''));
            if (material.length) {
              core.setFailed('HOLD: independent review identifies ' + material.length + ' P0/P1/P2 finding(s) on exact PR head ' + head);
              return;
            }
            core.info('Independent Codex receipt on ' + head + '; no material findings on this revision.');
