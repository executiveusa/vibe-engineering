name: Vibe Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # GitHub Models retired on 2026-07-30. The upstream reusable workflow still
    # targets that retired endpoint, so keep the integration installed but gated
    # until the repository is configured with a replacement OCR provider.
    if: github.event.pull_request.draft == false && vars.VIBE_OCR_ENABLED == 'true'
    uses: executiveusa/open-code-review/.github/workflows/vibe-code-review.yml@main
