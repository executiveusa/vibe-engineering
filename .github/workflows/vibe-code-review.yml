name: Vibe Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    # Pinned to an immutable commit, never @main. This ref runs OCR action
    # 310008fc, which fails closed: failed tool calls, a non-complete manifest
    # or unreadable output end in HOLD (the job fails, no "looks good" summary).
    # Move the pin only by reviewing a new commit.
    uses: executiveusa/open-code-review/.github/workflows/vibe-code-review.yml@d22123176c0e1cea08d9149a56ec8f0433cdee60
    with:
      llm_url: https://openrouter.ai/api/v1/chat/completions
      # Explicit free-lane slug. The reusable's default model is a PAID model,
      # so this input is load-bearing: do not remove it.
      model: nvidia/nemotron-3-super-120b-a12b:free
      use_anthropic: "false"
      ocr_version: "1.11.8"
      # Serial review keeps the burst under the free-tier rate cap.
      review_concurrency: "1"
      route_severity_below: low
      route_categories: style,documentation
      # NOTE: prompt-injection findings are reviewed under the `security` category
      # (the engine has no separate injection category) and are never routed away
      # from inline comments.
    secrets:
      llm_token: ${{ secrets.OPENROUTER_API_KEY }}
