name: Nightly Production Readiness Factory

on:
  # Automations ship OFF (independent review 2026-10-24): merging this file
  # must not enable nightly runs. Re-enabling the schedule is a conscious
  # owner act - uncomment deliberately.
  # schedule:
  #   - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      target_repository:
        description: "Optional: owner/repo to run the factory against (skips Vercel batch selection)"
        required: false
        type: string
      target_branch:
        description: "Optional: branch of target_repository (used with target_repository)"
        required: false
        type: string
      lane:
        description: "Model lane for this run (defaults to vars.VIBE_MODEL_LANE, then 'dry')"
        required: false
        type: choice
        options: [dry, free]

concurrency:
  group: nightly-production-readiness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.batch.outputs.matrix }}
      has_targets: ${{ steps.batch.outputs.has_targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: batch
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          TARGET_REPOSITORY_IN: ${{ inputs.target_repository }}
          TARGET_BRANCH_IN: ${{ inputs.target_branch }}
        run: node scripts/select-nightly-vercel-batch.mjs

  audit-prd-build-review:
    needs: select
    if: ${{ needs.select.outputs.has_targets == 'true' }}
    outputs:
      decision: ${{ steps.factory.outputs.decision }}
      output_sha: ${{ steps.factory.outputs.output_sha }}
      base_sha: ${{ steps.factory.outputs.base_sha }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.select.outputs.matrix) }}
    runs-on: ${{ vars.VIBE_FACTORY_RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      # Per-run lane: dispatch input wins, then the repo variable, then dry.
      # No global state flips when an owner experiments with a lane.
      LANE: ${{ inputs.lane || vars.VIBE_MODEL_LANE || 'dry' }}
      TARGET_REPOSITORY: ${{ matrix.repository }}
      TARGET_BRANCH: ${{ matrix.branch }}
      TARGET_PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: control
          persist-credentials: false
      - name: Guard target coordinates
        run: |
          case "$TARGET_REPOSITORY" in
            -*|*[!A-Za-z0-9_./-]*|*//*|/*|*/) echo "bad TARGET_REPOSITORY: $TARGET_REPOSITORY" >&2; exit 1 ;;
          esac
          case "$TARGET_BRANCH" in
            -*|*[!A-Za-z0-9_./-]*|*..*) echo "bad TARGET_BRANCH: $TARGET_BRANCH" >&2; exit 1 ;;
          esac
      - name: Detect target visibility (no credentials)
        # A PUBLIC target needs no token in any lane, so none is used: the
        # anonymous clone below then applies to the free lane too, and the
        # fleet token never enters the run. Fails closed: anything other than
        # an explicit "private": false (404, rate limit, network) counts as
        # private and routes to the read-only-token path, whose probe refuses
        # a token that can push.
        id: vis
        run: |
          private=$(curl -sf "https://api.github.com/repos/$TARGET_REPOSITORY" | jq -r '.private' 2>/dev/null || true)
          if [ "$private" = "false" ]; then echo "public=true" >> "$GITHUB_OUTPUT"; else echo "public=false" >> "$GITHUB_OUTPUT"; fi
          echo "target visibility: private=${private:-unknown}"
      - name: Clone target repository (anonymous, dry lane or public target)
        # The dry lane carries NO credentials at all: no fleet token, no model
        # keys, and the control checkout persists no token. A public target is
        # cloned the same way in every lane. An anonymous clone means no
        # GitHub credential exists in the environment for target-influenced
        # code to reach, and nothing that could push.
        if: ${{ env.LANE == 'dry' || steps.vis.outputs.public == 'true' }}
        run: git -c credential.helper= clone --branch "$TARGET_BRANCH" "https://github.com/$TARGET_REPOSITORY" target
      - name: Verify the fleet token is read-only on the target (non-dry lanes, private target)
        if: ${{ env.LANE != 'dry' && steps.vis.outputs.public != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
        run: |
          # Reports permission NAMES only - never the token. Fails closed:
          # push and admin must be exactly false (missing/null fields fail).
          perms=$(gh api "repos/$TARGET_REPOSITORY" --jq '.permissions')
          echo "fleet token permissions on $TARGET_REPOSITORY: $perms"
          push=$(echo "$perms" | jq -r '.push'); admin=$(echo "$perms" | jq -r '.admin')
          maintain=$(echo "$perms" | jq -r '.maintain // "absent"'); triage=$(echo "$perms" | jq -r '.triage // "absent"')
          if [ "$push" != "false" ] || [ "$admin" != "false" ] || [ "$maintain" = "true" ] || [ "$triage" = "true" ]; then
            echo "fleet token is not read-only on the target (push=$push admin=$admin maintain=$maintain triage=$triage)" >&2; exit 1
          fi
      - name: Clone target repository (fleet token, non-dry lanes, private target)
        if: ${{ env.LANE != 'dry' && steps.vis.outputs.public != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
        run: gh repo clone "$TARGET_REPOSITORY" target -- --branch "$TARGET_BRANCH"
      - name: Install factory prompts
        run: |
          mkdir -p target/.vibe-factory
          cp control/factory/*-prompt.md target/.vibe-factory/
          cp control/factory/run-readiness-sandcastle.mts control/factory/judge-receipt.mjs target/.vibe-factory/
          cp control/factory/dry-agent.mjs control/factory/dry-agent-run.mjs control/factory/dry-receipt.mjs target/.vibe-factory/
      - name: Install the pinned factory runtime (control side, NEVER the target)
        working-directory: control/factory/runtime
        # The key-bearing factory step must not resolve a single package through
        # the target repo (.npmrc registry override or package.json dependency
        # substitution; --ignore-scripts does not stop swapped code at import).
        # The runtime installs from OUR committed lockfile in OUR checkout,
        # with an explicit registry pin and an empty ambient config.
        run: npm ci --ignore-scripts --userconfig ./.npmrc --registry https://registry.npmjs.org
      - name: Stage the trusted runner inside the runtime tree
        # ESM resolution walks up from the SCRIPT location, so the runner and
        # its factory modules run from inside the runtime tree: every import
        # resolves to the pinned install, even though the step's cwd is the
        # target (sandcastle discovers the repo from cwd).
        run: |
          mkdir -p control/factory/runtime/run
          cp control/factory/run-readiness-sandcastle.mts control/factory/runtime/run/
          cp control/factory/judge-receipt.mjs control/factory/dry-agent.mjs control/factory/dry-agent-run.mjs control/factory/runtime/run/
          cp control/factory/dry-receipt.mjs control/factory/model-resolve.mjs control/factory/runtime/run/
          cp control/factory/evidence-chain.mjs control/factory/free-broker.mjs control/factory/runtime/run/
          cp control/factory/model-preferences.json control/factory/runtime/run/
      # The sandbox image used to be built by hand on a server; build it here instead (A3).
      # sandcastle's build-image reads <cwd>/.sandcastle (verified against the 0.6.4 CLI source),
      # so the control repo's config is copied into the target first.
      - name: Build the sandcastle image
        working-directory: target
        # sandcastle's build-image reads <cwd>/.sandcastle, so cwd stays the
        # target, but the BINARY is the pinned control-side runtime - npx from
        # a target cwd would resolve the package through the target's .npmrc.
        run: |
          cp -r ../control/.sandcastle .sandcastle
          start=$(date +%s)
          "$GITHUB_WORKSPACE/control/factory/runtime/node_modules/.bin/sandcastle" docker build-image --image-name sandcastle:vibe-engineering
          echo "sandcastle image build seconds: $(( $(date +%s) - start ))" >> "$GITHUB_STEP_SUMMARY"
      # Agents run here. This step gets model keys only: no GitHub token, so nothing an agent
      # does in the sandbox can push, merge or change repository settings.
      - id: factory
        name: Run audit, PRD, builder, and independent judge
        working-directory: target
        env:
          # The free lane carries ONLY the OpenRouter key (positive lane
          # predicate; the dry lane must see NO model secrets, and OpenAI /
          # Anthropic keys are never present in any Phase 1 lane). The runner
          # also refuses to start dry with keys set.
          OPENROUTER_API_KEY: ${{ env.LANE == 'free' && secrets.OPENROUTER_API_KEY || '' }}
          VIBE_MODEL_LANE: ${{ env.LANE }}
          VIBE_RUN_BUDGET_MINUTES: "120"
          VIBE_MAX_BUILD_ITERATIONS: "4"
        # cwd stays the target (sandcastle discovers the repo from it) but the
        # script and ALL its imports resolve from the pinned control runtime.
        # --tsconfig pins the compiler config too: a target tsconfig `paths`
        # remap could otherwise redirect bare imports to target files.
        run: node "$GITHUB_WORKSPACE/control/factory/runtime/node_modules/tsx/dist/cli.mjs" --tsconfig "$GITHUB_WORKSPACE/control/factory/runtime/tsconfig.json" "$GITHUB_WORKSPACE/control/factory/runtime/run/run-readiness-sandcastle.mts"
      # Phase 1+: this job writes NOTHING to the target repository. The
      # read-only fleet token guard above stays; results leave the run as
      # workflow artifacts (evidence chain, logs) and the preview. Opening a PR
      # on the target is a separate, later, owner-gated step with its own
      # write-scoped token.
      - name: Upload the evidence chain and worktree bundle
        # Evidence + a git bundle of the sandcastle worktree leave the run as
        # artifacts - never as target writes. The preview job checks out from
        # the bundle, not from a pushed branch.
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factory-evidence-${{ github.run_id }}-${{ matrix.project }}
          path: |
            target/evidence/
            target/factory.bundle
          if-no-files-found: warn
          retention-days: 90

  preview:
    # Phase 1 (4.3/4.4): basic-auth preview over a cloudflared quick tunnel +
    # iPhone journey. CODE ONLY until the owner channel clears the tunnel
    # placement. Isolation: the judged app's compose/Dockerfile run with
    # RUN-ONLY random creds; auth terminates in the pinned control-side proxy
    # (factory/preview-proxy.mjs); the real viewer secret never enters the app
    # environment. A HOLD verdict never previews: the evidence index must exist
    # with ok:true and its finalSha must equal the judged SHA.
    needs: [select, audit-prd-build-review]
    if: ${{ needs.select.outputs.has_targets == 'true' && (inputs.lane || vars.VIBE_MODEL_LANE || 'dry') == 'free' && needs.audit-prd-build-review.outputs.decision == 'SHIP' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_REPOSITORY: ${{ matrix.repository }}
      TARGET_BRANCH: ${{ matrix.branch }}
      TARGET_PROJECT: ${{ matrix.project }}
      JUDGED_SHA: ${{ needs.audit-prd-build-review.outputs.output_sha }}
      DECISION: ${{ needs.audit-prd-build-review.outputs.decision }}
      PREVIEW_MINUTES: "45"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: control
          persist-credentials: false
      - name: Download this leg's evidence + bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: factory-evidence-${{ github.run_id }}-${{ matrix.project }}
          path: incoming
      - name: Verify the evidence chain BEFORE anything runs
        run: |
          test -n "$JUDGED_SHA" || { echo 'no judged output_sha from the agent job'; exit 1; }
          test -f "incoming/evidence/$JUDGED_SHA/index.json" || { echo "no evidence index for $JUDGED_SHA"; exit 1; }
          node -e '
            const i = require("./incoming/evidence/" + process.env.JUDGED_SHA + "/index.json");
            if (i.ok !== true) { console.error("evidence chain not ok:", i.reason); process.exit(1); }
            if (i.finalSha !== process.env.JUDGED_SHA) { console.error("index finalSha mismatch"); process.exit(1); }
            console.log("evidence chain ok:", i.stages, "stages");
          '
      - name: Check out the sandcastle worktree from the bundle (never pushed)
        run: |
          test -f incoming/factory.bundle
          git clone incoming/factory.bundle target
          test "$(git -C target rev-parse HEAD)" = "$JUDGED_SHA" || { echo 'bundle HEAD != judged SHA'; exit 1; }
          echo "$JUDGED_SHA" > target/web/BUILD_SHA
      - name: Fail closed without the viewer secret; generate RUN-ONLY app creds
        run: |
          test -n "$FACTORY_PREVIEW_BASIC_AUTH" || { echo 'FACTORY_PREVIEW_BASIC_AUTH secret missing'; exit 1; }
          echo "RUN_ONLY_PREVIEW_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "RUN_ONLY_API_KEY=run-only-$(openssl rand -hex 24)" >> "$GITHUB_ENV"
        env:
          FACTORY_PREVIEW_BASIC_AUTH: ${{ secrets.FACTORY_PREVIEW_BASIC_AUTH }}
      - name: Start Foundry + the trusted auth proxy via the PINNED control-side compose
        # The compose file (control repo) builds the judged app with no build
        # network, pins it to an internal-only network (no egress, no published
        # port, mem/cpu/pid caps, no-new-privileges, cap_drop ALL) and runs the
        # auth proxy as a pinned image mounting the pinned proxy source. The
        # real viewer secret exists ONLY in the proxy service's env.
        working-directory: control
        env:
          FACTORY_PREVIEW_BASIC_AUTH: ${{ secrets.FACTORY_PREVIEW_BASIC_AUTH }}
        run: |
          mv ../target target
          docker compose -f docker-compose.preview.yml up -d --build
          # The app is unpublished by design; the readiness signal is the PROXY
          # refusing anonymous requests on its localhost-only port.
          ok=""
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8010/ || true)
            if [ "$code" = "401" ]; then ok=1; break; fi
            sleep 2
          done
          test -n "$ok" || { echo 'proxy never came up refusing anonymous'; docker compose -f docker-compose.preview.yml logs --tail 50; exit 1; }
      - name: Open the quick tunnel to the PROXY (never the app directly)
        run: |
          curl -sSfL -o cloudflared https://github.com/cloudflare/cloudflared/releases/download/2024.12.2/cloudflared-linux-amd64
          # Pin + verify the release's PUBLISHED sha256 (release notes of
          # cloudflared 2024.12.2) before the binary is ever executed.
          echo "5237675a5e806120729acc78c5be02f9db5f406717699587abfa72b49b39fe40  cloudflared" | sha256sum -c -
          chmod +x cloudflared
          ./cloudflared tunnel --url http://127.0.0.1:8010 --no-autoupdate > tunnel.log 2>&1 &
          echo $! > cloudflared.pid
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare.com' tunnel.log | head -1) && break || sleep 2
          done
          test -n "$URL" || { echo 'no tunnel URL'; exit 1; }
          echo "TUNNEL_URL=$URL" >> "$GITHUB_ENV"
      - name: "Gate: anonymous is refused BEFORE the URL is shown anywhere"
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$TUNNEL_URL/")
          test "$code" = 401 || { echo "anonymous got $code, expected 401 - tearing down"; exit 1; }
      - name: "Gate: BUILD_SHA through the tunnel equals the judged SHA"
        env:
          FACTORY_PREVIEW_BASIC_AUTH: ${{ secrets.FACTORY_PREVIEW_BASIC_AUTH }}
        run: |
          got=$(curl -sf -u "$FACTORY_PREVIEW_BASIC_AUTH" "$TUNNEL_URL/BUILD_SHA")
          test "$got" = "$JUDGED_SHA" || { echo "BUILD_SHA mismatch: $got != $JUDGED_SHA"; exit 1; }
      - name: Publish the URL only AFTER both gates pass
        run: |
          echo "preview URL (basic-auth protected, decision: $DECISION): $TUNNEL_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: iPhone journey (Playwright, through the proxy)
        working-directory: control
        env:
          TUNNEL_URL: ${{ env.TUNNEL_URL }}
          JUDGED_SHA: ${{ env.JUDGED_SHA }}
          FACTORY_PREVIEW_BASIC_AUTH: ${{ secrets.FACTORY_PREVIEW_BASIC_AUTH }}
          JOURNEY_OUT: journey-out
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.49.1
          npx playwright install --with-deps chromium
          npx playwright test factory/journeys/foundry.spec.ts --reporter=line
      - name: Hold the preview for the owner (bounded 45 minutes)
        run: |
          M=$(( ${PREVIEW_MINUTES:-45} > 45 ? 45 : ${PREVIEW_MINUTES:-45} ))
          echo "holding $M minutes (job timeout 60m is the hard ceiling)"
          sleep $(( M * 60 ))
      - name: Upload journey evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factory-journey-${{ github.run_id }}-${{ matrix.project }}
          path: control/journey-out/
          if-no-files-found: warn
          retention-days: 90
      - name: Teardown (always, durable)
        if: ${{ always() }}
        working-directory: control
        run: |
          test ! -f ../cloudflared.pid || kill "$(cat ../cloudflared.pid)" || true
          docker compose -f docker-compose.preview.yml down --remove-orphans || true
