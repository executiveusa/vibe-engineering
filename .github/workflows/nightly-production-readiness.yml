name: Nightly Production Readiness Factory

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      target_repository:
        description: "Optional: owner/repo to run the factory against (skips Vercel batch selection)"
        required: false
        type: string
      target_branch:
        description: "Optional: branch of target_repository (used with target_repository)"
        required: false
        type: string

concurrency:
  group: nightly-production-readiness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.batch.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: batch
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          TARGET_REPOSITORY_IN: ${{ inputs.target_repository }}
          TARGET_BRANCH_IN: ${{ inputs.target_branch }}
        run: |
          if [ -n "$TARGET_REPOSITORY_IN" ]; then
            branch="${TARGET_BRANCH_IN:-main}"
            project="${TARGET_REPOSITORY_IN##*/}"
            matrix=$(jq -cn --arg p "$project" --arg r "$TARGET_REPOSITORY_IN" --arg b "$branch" '{include:[{project:$p,repository:$r,branch:$b,state:"MANUAL",priority:0}]}')
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          else
            node scripts/select-nightly-vercel-batch.mjs
          fi

  audit-prd-build-review:
    needs: select
    if: ${{ needs.select.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.select.outputs.matrix) }}
    runs-on: [self-hosted, linux, x64, vibe-sandcastle]
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ matrix.repository }}
      TARGET_BRANCH: ${{ matrix.branch }}
      TARGET_PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: control
          persist-credentials: false
      - name: Clone target repository
        env:
          GH_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
        run: gh repo clone "$TARGET_REPOSITORY" target -- --branch "$TARGET_BRANCH"
      - name: Install factory prompts
        run: |
          mkdir -p target/.vibe-factory
          cp control/factory/*-prompt.md target/.vibe-factory/
          cp control/factory/run-readiness-sandcastle.mts control/factory/judge-receipt.mjs target/.vibe-factory/
      - name: Install Sandcastle runtime
        working-directory: target
        run: npm install --no-save @ai-hero/sandcastle@0.6.4 tsx@4.23.15
      # Agents run here. This step gets model keys only: no GitHub token, so nothing an agent
      # does in the sandbox can push, merge or change repository settings.
      - id: factory
        name: Run audit, PRD, builder, and independent judge
        working-directory: target
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VIBE_RUN_BUDGET_MINUTES: "120"
          VIBE_MAX_BUILD_ITERATIONS: "4"
        run: npx tsx .vibe-factory/run-readiness-sandcastle.mts
      - name: Open pull request from retained branch
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
          SANDCASTLE_BRANCH: ${{ steps.factory.outputs.branch }}
          DECISION: ${{ steps.factory.outputs.decision }}
        run: |
          test -n "$SANDCASTLE_BRANCH"
          case "$DECISION" in SHIP|HOLD) ;; *) echo "unknown decision: $DECISION" >&2; exit 1 ;; esac
          if [ "$(git rev-list --count "origin/$TARGET_BRANCH..$SANDCASTLE_BRANCH")" = "0" ]; then
            echo "No commits on $SANDCASTLE_BRANCH ($DECISION); nothing to open."
            exit 0
          fi
          git push --set-upstream origin "$SANDCASTLE_BRANCH:$SANDCASTLE_BRANCH"
          gh pr create --draft --base "$TARGET_BRANCH" --head "$SANDCASTLE_BRANCH" \
            --title "[$DECISION] Production readiness: audit, PRD, and bounded execution" \
            --body "Nightly Vibe Engineering run for $TARGET_PROJECT. Judge decision (re-checked by the runner): **$DECISION**. Includes the completion audit, production-readiness PRD, bounded implementation, a review by a Judge from a different model family, Judge evidence, and rollback notes. The Vibe merge gate blocks this PR unless the Judge receipt is SHIP, current, and every required check passes."
