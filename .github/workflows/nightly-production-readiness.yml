name: Nightly Production Readiness Factory

on:
  # Automations ship OFF (independent review 2026-10-24): merging this file
  # must not enable nightly runs. Re-enabling the schedule is a conscious
  # owner act - uncomment deliberately.
  # schedule:
  #   - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      target_repository:
        description: "Optional: owner/repo to run the factory against (skips Vercel batch selection)"
        required: false
        type: string
      target_branch:
        description: "Optional: branch of target_repository (used with target_repository)"
        required: false
        type: string

concurrency:
  group: nightly-production-readiness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.batch.outputs.matrix || steps.starnet.outputs.matrix }}
      has_targets: ${{ steps.batch.outputs.has_targets || steps.starnet.outputs.has_targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: batch
        if: ${{ vars.VIBE_TARGET_SOURCE != 'starnet' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          TARGET_REPOSITORY_IN: ${{ inputs.target_repository }}
          TARGET_BRANCH_IN: ${{ inputs.target_branch }}
        run: node scripts/select-nightly-vercel-batch.mjs
      # StarNet source (pauli-starnet starnet-v2/06): the day's repos come from the gateway's intake queue, which
      # Instinct fills after the captain's grill. Queued rows only; assumed-answer rows wait for the captain.
      - id: starnet
        if: ${{ vars.VIBE_TARGET_SOURCE == 'starnet' }}
        env:
          STARNET_GATEWAY_URL: ${{ vars.STARNET_GATEWAY_URL }}
          STARNET_GATEWAY_TOKEN: ${{ secrets.STARNET_GATEWAY_TOKEN }}
        run: node scripts/select-starnet-intake.mjs

  audit-prd-build-review:
    needs: select
    if: ${{ needs.select.outputs.has_targets == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.select.outputs.matrix) }}
    runs-on: ${{ vars.VIBE_FACTORY_RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ matrix.repository }}
      TARGET_BRANCH: ${{ matrix.branch }}
      TARGET_PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: control
          persist-credentials: false
      - name: Guard target coordinates
        run: |
          case "$TARGET_REPOSITORY" in
            -*|*[!A-Za-z0-9_./-]*|*//*|/*|*/) echo "bad TARGET_REPOSITORY: $TARGET_REPOSITORY" >&2; exit 1 ;;
          esac
          case "$TARGET_BRANCH" in
            -*|*[!A-Za-z0-9_./-]*|*..*) echo "bad TARGET_BRANCH: $TARGET_BRANCH" >&2; exit 1 ;;
          esac
      - name: Clone target repository (anonymous, dry lane)
        # The dry lane carries NO credentials at all: no fleet token, no model
        # keys, and the control checkout persists no token. An anonymous clone
        # of the public target means no credential exists in the environment
        # for target-influenced code to reach, and nothing that could push.
        if: ${{ vars.VIBE_MODEL_LANE == 'dry' }}
        run: git -c credential.helper= clone --branch "$TARGET_BRANCH" "https://github.com/$TARGET_REPOSITORY" target
      - name: Verify the fleet token is read-only on the target (non-dry lanes)
        if: ${{ vars.VIBE_MODEL_LANE != 'dry' }}
        env:
          GH_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
        run: |
          # Reports permission NAMES only - never the token. Fails closed:
          # push and admin must be exactly false (missing/null fields fail).
          perms=$(gh api "repos/$TARGET_REPOSITORY" --jq '.permissions')
          echo "fleet token permissions on $TARGET_REPOSITORY: $perms"
          push=$(echo "$perms" | jq -r '.push'); admin=$(echo "$perms" | jq -r '.admin')
          maintain=$(echo "$perms" | jq -r '.maintain // "absent"'); triage=$(echo "$perms" | jq -r '.triage // "absent"')
          if [ "$push" != "false" ] || [ "$admin" != "false" ] || [ "$maintain" = "true" ] || [ "$triage" = "true" ]; then
            echo "fleet token is not read-only on the target (push=$push admin=$admin maintain=$maintain triage=$triage)" >&2; exit 1
          fi
      - name: Clone target repository (fleet token, non-dry lanes)
        if: ${{ vars.VIBE_MODEL_LANE != 'dry' }}
        env:
          GH_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
        run: gh repo clone "$TARGET_REPOSITORY" target -- --branch "$TARGET_BRANCH"
      - name: Install factory prompts
        run: |
          mkdir -p target/.vibe-factory
          cp control/factory/*-prompt.md target/.vibe-factory/
          cp control/factory/run-readiness-sandcastle.mts control/factory/judge-receipt.mjs target/.vibe-factory/
          cp control/factory/dry-agent.mjs control/factory/dry-agent-run.mjs control/factory/dry-receipt.mjs target/.vibe-factory/
      - name: Install Sandcastle runtime
        working-directory: target
        # --ignore-scripts: install hooks are the one code-execution path in this
        # step; dropping them keeps registry code from running before the
        # key-bearing factory step. Mitigation only, not an isolation claim.
        run: npm install --no-save --ignore-scripts @ai-hero/sandcastle@0.6.4 tsx@4.23.15
      # The sandbox image used to be built by hand on a server; build it here instead (A3).
      # sandcastle's build-image reads <cwd>/.sandcastle (verified against the 0.6.4 CLI source),
      # so the control repo's config is copied into the target first.
      - name: Build the sandcastle image
        working-directory: target
        run: |
          cp -r ../control/.sandcastle .sandcastle
          start=$(date +%s)
          npx --yes @ai-hero/sandcastle@0.6.4 docker build-image --image-name sandcastle:vibe-engineering
          echo "sandcastle image build seconds: $(( $(date +%s) - start ))" >> "$GITHUB_STEP_SUMMARY"
      # Agents run here. This step gets model keys only: no GitHub token, so nothing an agent
      # does in the sandbox can push, merge or change repository settings.
      - id: factory
        name: Run audit, PRD, builder, and independent judge
        working-directory: target
        env:
          # Dry lane runs with NO model secrets: positive non-dry predicate
          # (the inverse pattern 'lane==dry && '' || secrets.X' would fall back
          # to the secret). The runner also refuses to start dry with keys set.
          OPENAI_API_KEY: ${{ vars.VIBE_MODEL_LANE != 'dry' && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ vars.VIBE_MODEL_LANE != 'dry' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ vars.VIBE_MODEL_LANE != 'dry' && secrets.OPENROUTER_API_KEY || '' }}
          VIBE_MODEL_LANE: ${{ vars.VIBE_MODEL_LANE }}
          VIBE_RUN_BUDGET_MINUTES: "120"
          VIBE_MAX_BUILD_ITERATIONS: "4"
        run: npx tsx .vibe-factory/run-readiness-sandcastle.mts
      - name: Open pull request from retained branch
        # The dry lane is pipeline mechanics only: it must never write to the
        # target repository, even when every stage succeeds.
        if: ${{ vars.VIBE_MODEL_LANE != 'dry' }}
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
          SANDCASTLE_BRANCH: ${{ steps.factory.outputs.branch }}
          DECISION: ${{ steps.factory.outputs.decision }}
        run: |
          test -n "$SANDCASTLE_BRANCH"
          case "$DECISION" in SHIP|HOLD) ;; *) echo "unknown decision: $DECISION" >&2; exit 1 ;; esac
          if [ "$(git rev-list --count "origin/$TARGET_BRANCH..$SANDCASTLE_BRANCH")" = "0" ]; then
            echo "No commits on $SANDCASTLE_BRANCH ($DECISION); nothing to open."
            exit 0
          fi
          git push --set-upstream origin "$SANDCASTLE_BRANCH:$SANDCASTLE_BRANCH"
          gh pr create --draft --base "$TARGET_BRANCH" --head "$SANDCASTLE_BRANCH" \
            --title "[$DECISION] Production readiness: audit, PRD, and bounded execution" \
            --body "Nightly Vibe Engineering run for $TARGET_PROJECT. Judge decision (re-checked by the runner): **$DECISION**. Includes the completion audit, production-readiness PRD, bounded implementation, a review by a Judge from a different model family, Judge evidence, and rollback notes. The Vibe merge gate blocks this PR unless the Judge receipt is SHIP, current, and every required check passes."
