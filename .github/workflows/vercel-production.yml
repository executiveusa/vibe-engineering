name: Vercel Production

on:
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_5qS6dGopLozD0HWaND62MGtM
      VERCEL_PROJECT_ID: prj_KSlSLaANY91c08ZSrzsxxd37dUpB
      VERCEL_GIT_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Guard deployment credential
        id: credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::VERCEL_TOKEN is not configured; production deployment did not run."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.credential.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull Vercel project settings
        if: steps.credential.outputs.configured == 'true'
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel artifact
        if: steps.credential.outputs.configured == 'true'
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy verified artifact to production
        if: steps.credential.outputs.configured == 'true'
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verify production homepage and runtime
        if: steps.credential.outputs.configured == 'true'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          curl --fail --silent --show-error \
            https://vibe-engineering-lime.vercel.app/ \
            | tee /tmp/vibe-homepage.html
          grep -Fq "Software got cheap." /tmp/vibe-homepage.html

          curl --fail --silent --show-error \
            https://vibe-engineering-lime.vercel.app/api/v1/self-test \
            | tee /tmp/vibe-self-test.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/vibe-self-test.json","utf8")); if(!x.ok || x.sourceCommit !== process.env.EXPECTED_SHA) process.exit(1);'

      - name: Fail when deployment was skipped
        if: steps.credential.outputs.configured != 'true'
        shell: bash
        run: |
          echo "Production is not verified because the Vercel credential is missing."
          exit 1
